<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isekai RPG Fix</title>
    <style>
        body { background: #000; color: #00ffcc; text-align: center; font-family: sans-serif; }
        .btn { padding: 20px; margin: 20px; background: #222; color: #fff; border: 2px solid #00ffcc; border-radius: 10px; width: 80%; font-size: 18px; }
        #debug-log { background: #111; color: #ff0000; padding: 10px; margin: 10px; font-size: 12px; border: 1px solid #333; text-align: left; overflow-y: auto; max-height: 150px; }
    </style>
</head>
<body>
    <h1>ISEKAI LOGIN TEST</h1>
    
    <div id="login-area">
        <button class="btn" onclick="startLogin()">Login with Google (Popup)</button>
    </div>

    <div id="game-area" style="display:none;">
        <h2>Welcome to Isekai!</h2>
        <p id="user-name"></p>
        <button class="btn" onclick="alert('Entering Game...')">START GAME</button>
    </div>

    <div id="debug-log">Log: Waiting for action...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // သင့်ရဲ့ Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAiEx6C2P-Ly-zwQbDvmOZPwkFHhIC1Prs",
            authDomain: "isekai-game-d2b11.firebaseapp.com",
            projectId: "isekai-game-d2b11",
            storageBucket: "isekai-game-d2b11.firebasestorage.app",
            messagingSenderId: "148136784251",
            appId: "1:148136784251:web:6e86de199174388f290dde",
            measurementId: "G-ZZFD25JJS7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        function log(msg) {
            document.getElementById('debug-log').innerHTML += "<br>> " + msg;
        }

        window.startLogin = async () => {
            log("Attempting Login...");
            try {
                const result = await signInWithPopup(auth, provider);
                log("Success! Welcome " + result.user.displayName);
            } catch (error) {
                log("Error: " + error.code);
                log("Message: " + error.message);
                
                if (error.code === 'auth/operation-not-allowed') {
                    log("!! Firebase မှာ Google Login ကို Enable မလုပ်ထားသေးပါ !!");
                }
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-area').style.display = "none";
                document.getElementById('game-area').style.display = "block";
                document.getElementById('user-name').innerText = "Player: " + user.displayName;
                log("User is already logged in.");
            }
        });
    </script>
</body>
</html>
