<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Isekai RPG Online</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 100; text-align: center; }
        .btn { padding: 15px 30px; margin: 10px; background: #222; color: white; border: 2px solid #00ffcc; border-radius: 10px; width: 220px; font-weight: bold; cursor: pointer; }
        #loading-text { color: #00ffcc; margin-top: 15px; font-style: italic; }
        #ui { position: absolute; top: 20px; left: 20px; color: #00ffcc; z-index: 50; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; display: none; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 id="menuTitle">ISEKAI WORLD</h1>
        <div id="status-area">
            <button id="login-btn" class="btn" style="border-color: #4285F4; display: none;" onclick="signIn()">Sign in with Google</button>
            <div id="loading-text">စစ်ဆေးနေသည်... ခေတ္တစောင့်ပါ...</div>
        </div>
        
        <div id="setupSection" style="display:none;">
            <p id="welcomeMsg"></p>
            <button class="btn" onclick="startIsekai()">Enter Isekai World</button>
        </div>
    </div>

    <div id="ui">HP: 100 | Level: 1</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithRedirect, getRedirectResult, onAuthStateChanged, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // သင်တင်ထားတဲ့ ပုံထဲက Config အတိုင်းဖြစ်ပါတယ်
        const firebaseConfig = {
            apiKey: "AIzaSyAiEx6C2P-Ly-zwQbDvmOZPwkFHhIC1Prs",
            authDomain: "isekai-game-d2b11.firebaseapp.com",
            projectId: "isekai-game-d2b11",
            storageBucket: "isekai-game-d2b11.firebasestorage.app",
            messagingSenderId: "148136784251",
            appId: "1:148136784251:web:6e86de199174388f290dde",
            measurementId: "G-ZZFD25JJS7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Login Function
        window.signIn = () => {
            signInWithRedirect(auth, provider);
        };

        // အရေးကြီးဆုံးအပိုင်း - Login ဝင်ပြီး ပြန်လာတာကို ဖမ်းယူခြင်း
        getRedirectResult(auth).then((result) => {
            if (result?.user) {
                console.log("Login Success via Redirect");
            }
        }).catch((error) => {
            alert("Error: " + error.message);
        });

        // User ရှိမရှိ အမြဲစောင့်ကြည့်ခြင်း
        onAuthStateChanged(auth, (user) => {
            const loginBtn = document.getElementById('login-btn');
            const loadingText = document.getElementById('loading-text');
            
            if (user) {
                loadingText.style.display = "none";
                loginBtn.style.display = "none";
                document.getElementById('setupSection').style.display = "block";
                document.getElementById('welcomeMsg').innerText = "အဆင်သင့်ဖြစ်ပါပြီ " + user.displayName;
            } else {
                loadingText.style.display = "none";
                loginBtn.style.display = "block";
            }
        });

        window.startIsekai = () => {
            document.getElementById('overlay').style.display = "none";
            document.getElementById('ui').style.display = "block";
            alert("Isekai ကမ္ဘာထဲသို့ ရောက်ရှိသွားပါပြီ။");
            // ဒီနေရာမှာ ဂိမ်းရဲ့ 3D မြင်ကွင်း ကုဒ်တွေ ဆက်ထည့်နိုင်ပါတယ်
        };
    </script>
</body>
</html>
