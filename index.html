<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Isekai RPG Online</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 100; text-align: center; }
        .btn { padding: 15px 30px; margin: 10px; cursor: pointer; background: #222; color: white; border: 2px solid #00ffcc; border-radius: 10px; width: 250px; font-weight: bold; }
        #ui { position: absolute; top: 20px; left: 20px; color: #00ffcc; pointer-events: none; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; display: none; z-index: 50; }
        
        /* Joystick */
        #joy-container { position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 2px solid rgba(0,255,204,0.3); border-radius: 50%; display: none; }
        #joy-stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: #fff; border-radius: 50%; box-shadow: 0 0 15px #00ffcc; }
        
        #loading { color: #00ffcc; margin-top: 10px; font-style: italic; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 id="menuTitle">ISEKAI WORLD</h1>
        
        <div id="loginSection">
            <p>ဂိမ်းဆော့ရန် Google နှင့် Login အရင်ဝင်ပေးပါ</p>
            <button class="btn" style="border-color: #4285F4;" onclick="signIn()">Sign in with Google</button>
            <div id="loading">Checking login status...</div>
        </div>

        <div id="genderSection" style="display:none;">
            <p>သင်၏ လိင်အမျိုးအစားကို ရွေးချယ်ပါ</p>
            <button class="btn" onclick="setGender('Male')">Male (ကျား)</button>
            <button class="btn" onclick="setGender('Female')">Female (မ)</button>
        </div>

        <div id="classSection" style="display:none;">
            <p>သင်၏ Class ကို ရွေးချယ်ပါ</p>
            <button class="btn" onclick="startIsekai('Warrior')">Warrior (ဓားသမား)</button>
            <button class="btn" onclick="startIsekai('Archer')">Archer (မြှားသမား)</button>
            <button class="btn" onclick="startIsekai('Mage')">Mage (မှော်ဆရာ)</button>
        </div>
    </div>

    <div id="joy-container"><div id="joy-stick"></div></div>
    <div id="ui">
        <b>Name:</b> <span id="nDisplay">-</span><br>
        <b>Class:</b> <span id="cDisplay">-</span> | <b>Weapon:</b> <span id="wDisplay">-</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAiEx6C2P-Ly-zwQbDvmOZPwkFHhIC1Prs",
            authDomain: "isekai-game-d2b11.firebaseapp.com",
            projectId: "isekai-game-d2b11",
            storageBucket: "isekai-game-d2b11.firebasestorage.app",
            messagingSenderId: "148136784251",
            appId: "1:148136784251:web:6e86de199174388f290dde",
            measurementId: "G-ZZFD25JJS7",
            databaseURL: "https://isekai-game-d2b11-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let gender, pClass, weapon, user;
        let playerObj, scene, camera, renderer;
        let moveX = 0, moveZ = 0;

        // Login Function (စာမျက်နှာတစ်ခုလုံးကို Redirect လုပ်မည်)
        window.signIn = () => {
            document.getElementById('loading').innerText = "Redirecting to Google...";
            signInWithRedirect(auth, provider);
        };

        // Page ပြန်ပွင့်လာချိန်တွင် Login ဖြစ်မဖြစ် စစ်ဆေးခြင်း
        onAuthStateChanged(auth, (u) => {
            if (u) {
                user = u;
                onLoginSuccess();
            } else {
                document.getElementById('loading').innerText = "Please login to start.";
            }
        });

        function onLoginSuccess() {
            document.getElementById('loginSection').style.display = "none";
            document.getElementById('nDisplay').innerText = user.displayName;
            
            // Database ထဲမှာ user ရှိပြီးသားလား စစ်ဆေးခြင်း
            get(ref(db, 'players/' + user.uid)).then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    pClass = data.class;
                    weapon = data.weapon;
                    gender = data.gender;
                    startGameplay();
                } else {
                    document.getElementById('genderSection').style.display = "block";
                    document.getElementById('menuTitle').innerText = "Welcome, " + user.displayName;
                }
            });
        }

        window.setGender = (g) => {
            gender = g;
            document.getElementById('genderSection').style.display = "none";
            document.getElementById('classSection').style.display = "block";
        };

        window.startIsekai = (c) => {
            pClass = c;
            weapon = (c==='Warrior') ? "Steel Sword" : (c==='Archer' ? "Long Bow" : "Magic Staff");
            set(ref(db, 'players/' + user.uid), {
                name: user.displayName,
                gender: gender,
                class: pClass,
                weapon: weapon,
                level: 1,
                hp: 100,
                lastSeen: Date.now()
            }).then(() => startGameplay());
        };

        function startGameplay() {
            document.getElementById('overlay').style.display = "none";
            document.getElementById('joy-container').style.display = "block";
            document.getElementById('ui').style.display = "block";
            document.getElementById('cDisplay').innerText = pClass;
            document.getElementById('wDisplay').innerText = weapon;
            init3D();
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020205);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.GridHelper(200, 40, 0x00ffcc, 0x111111));
            playerObj = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshPhongMaterial({ color: 0x00ffcc }));
            playerObj.position.y = 1;
            scene.add(playerObj);

            const light = new THREE.PointLight(0xffffff, 1, 100);
            light.position.set(10, 10, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040));

            camera.position.set(0, 5, 10);
            animate();
        }

        // Joystick Control
        const joyStick = document.getElementById('joy-stick');
        const joyContainer = document.getElementById('joy-container');

        joyContainer.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = joyContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width/2;
            const centerY = rect.top + rect.height/2;
            let deltaX = touch.clientX - centerX;
            let deltaY = touch.clientY - centerY;
            const dist = Math.min(Math.sqrt(deltaX*deltaX + deltaY*deltaY), 40);
            const angle = Math.atan2(deltaY, deltaX);
            moveX = Math.cos(angle) * (dist/40) * 0.2;
            moveZ = Math.sin(angle) * (dist/40) * 0.2;
            joyStick.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
        });

        joyContainer.addEventListener('touchend', () => {
            moveX = 0; moveZ = 0;
            joyStick.style.transform = `translate(0px, 0px)`;
        });

        function animate() {
            requestAnimationFrame(animate);
            if(playerObj) {
                playerObj.position.x += moveX;
                playerObj.position.z += moveZ;
                camera.position.set(playerObj.position.x, 5, playerObj.position.z + 10);
                camera.lookAt(playerObj.position);
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
