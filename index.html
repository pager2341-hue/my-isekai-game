<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Isekai RPG Online</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 100; text-align: center; }
        .btn { padding: 15px 30px; margin: 10px; background: #222; color: white; border: 2px solid #00ffcc; border-radius: 10px; width: 220px; font-weight: bold; cursor: pointer; }
        
        /* Gameplay UI */
        #ui { position: absolute; top: 20px; left: 20px; color: #00ffcc; pointer-events: none; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; display: none; z-index: 50; }
        #attack-btn { position: absolute; bottom: 50px; right: 50px; width: 85px; height: 85px; background: rgba(255,0,0,0.7); border: 4px solid white; border-radius: 50%; color: white; font-weight: bold; display: none; z-index: 50; outline: none; }
        #attack-btn:active { background: white; color: red; }

        /* Joystick */
        #joy-container { position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 2px solid #00ffcc; border-radius: 50%; display: none; }
        #joy-stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: #fff; border-radius: 50%; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 id="menuTitle">ISEKAI WORLD</h1>
        <div id="loginSection">
            <button class="btn" style="border-color: #4285F4;" onclick="signIn()">Sign in with Google</button>
        </div>
        <div id="genderSection" style="display:none;">
            <p>Select Gender</p>
            <button class="btn" onclick="setGender('Male')">Male</button>
            <button class="btn" onclick="setGender('Female')">Female</button>
        </div>
        <div id="classSection" style="display:none;">
            <p>Select Your Class</p>
            <button class="btn" onclick="startIsekai('Warrior')">Warrior</button>
            <button class="btn" onclick="startIsekai('Archer')">Archer</button>
            <button class="btn" onclick="startIsekai('Mage')">Mage</button>
        </div>
    </div>

    <div id="ui">
        <b>Name:</b> <span id="nDisplay">-</span><br>
        <b>Class:</b> <span id="cDisplay">-</span><br>
        <b>Monsters Killed:</b> <span id="kills">0</span>
    </div>
    
    <button id="attack-btn" onclick="playerAttack()">ATTACK</button>
    <div id="joy-container"><div id="joy-stick"></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAiEx6C2P-Ly-zwQbDvmOZPwkFHhIC1Prs",
            authDomain: "isekai-game-d2b11.firebaseapp.com",
            projectId: "isekai-game-d2b11",
            storageBucket: "isekai-game-d2b11.firebasestorage.app",
            messagingSenderId: "148136784251",
            appId: "1:148136784251:web:6e86de199174388f290dde",
            measurementId: "G-ZZFD25JJS7",
            databaseURL: "https://isekai-game-d2b11-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let user, playerObj, scene, camera, renderer;
        let moveX = 0, moveZ = 0, killCount = 0;
        let monsters = [];

        window.signIn = () => signInWithRedirect(auth, provider);

        onAuthStateChanged(auth, (u) => {
            if (u) {
                user = u;
                document.getElementById('loginSection').style.display = "none";
                document.getElementById('genderSection').style.display = "block";
                document.getElementById('nDisplay').innerText = user.displayName;
            }
        });

        window.setGender = (g) => {
            document.getElementById('genderSection').style.display = "none";
            document.getElementById('classSection').style.display = "block";
        };

        window.startIsekai = (c) => {
            document.getElementById('overlay').style.display = "none";
            document.getElementById('joy-container').style.display = "block";
            document.getElementById('attack-btn').style.display = "block";
            document.getElementById('ui').style.display = "block";
            document.getElementById('cDisplay').innerText = c;
            init3D();
            setInterval(spawnMonster, 4000); // 4 စက္ကန့်တိုင်း Monster တစ်ကောင် ပေါ်မယ်
        };

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.GridHelper(100, 40, 0x00ffcc, 0x111111));
            
            // Player ကို အပြာရောင် Cube အနေနဲ့ ထည့်မယ်
            playerObj = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshPhongMaterial({ color: 0x00ffcc }));
            playerObj.position.y = 1;
            scene.add(playerObj);

            const light = new THREE.PointLight(0xffffff, 1, 100);
            light.position.set(10, 10, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040));

            camera.position.set(0, 5, 10);
            animate();
        }

        function spawnMonster() {
            // Monster ကို အနီရောင် Cube အနေနဲ့ ထည့်မယ်
            const m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
            m.position.set(Math.random()*40-20, 0.5, Math.random()*40-20);
            scene.add(m);
            monsters.push(m);
        }

        window.playerAttack = () => {
            // Player နဲ့ အနီးဆုံးက Monster ကို ရှာပြီး ဓားနဲ့ခုတ်မယ်
            monsters.forEach((m, index) => {
                if(m.position.distanceTo(playerObj.position) < 3.5) {
                    scene.remove(m);
                    monsters.splice(index, 1);
                    killCount++;
                    document.getElementById('kills').innerText = killCount;
                }
            });
        };

        function animate() {
            requestAnimationFrame(animate);
            if(playerObj) {
                playerObj.position.x += moveX;
                playerObj.position.z += moveZ;
                camera.position.set(playerObj.position.x, 5, playerObj.position.z + 10);
                camera.lookAt(playerObj.position);

                // Monster တွေက Player ဆီကို လာနေမယ်
                monsters.forEach(m => {
                    const dx = playerObj.position.x - m.position.x;
                    const dz = playerObj.position.z - m.position.z;
                    m.position.x += dx * 0.005;
                    m.position.z += dz * 0.005;
                });
            }
            renderer.render(scene, camera);
        }

        // Joystick Control
        const joyStick = document.getElementById('joy-stick');
        const joyContainer = document.getElementById('joy-container');
        joyContainer.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            const rect = joyContainer.getBoundingClientRect();
            const dx = touch.clientX - (rect.left + 60);
            const dy = touch.clientY - (rect.top + 60);
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 40);
            const angle = Math.atan2(dy, dx);
            moveX = Math.cos(angle) * (dist/40) * 0.15;
            moveZ = Math.sin(angle) * (dist/40) * 0.15;
            joyStick.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
        });
        joyContainer.addEventListener('touchend', () => { moveX = 0; moveZ = 0; joyStick.style.transform = "none"; });
    </script>
</body>
</html>
